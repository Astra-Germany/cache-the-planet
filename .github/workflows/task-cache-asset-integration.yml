name: Task build cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Astra-Germany/cache-the-planet
  TASK_TEMP_DIR: ${{ github.workspace }}/examples/task-cache/.cache/task-state

permissions:
  contents: read

jobs:
  save-cache:
    name: Run task and save asset cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**') }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Run task build
        run: task --taskfile examples/task-cache/Taskfile.yml build

      - name: Save task build cache asset
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**') }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: true

  restore-cache:
    name: Restore task cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**') }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/${{ github.event.repository.default_branch }}/task/linux-x64/${{ hashFiles('examples/task-cache/Taskfile.yml', 'examples/task-cache/src/**') }}/v1"

      - name: Verify restored task cache
        run: task --taskfile examples/task-cache/Taskfile.yml verify
