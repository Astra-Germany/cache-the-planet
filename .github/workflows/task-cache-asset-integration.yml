name: Task build cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Astra-Germany/cache-the-planet
  TASK_TEMP_DIR: ${{ github.workspace }}/examples/task-cache/.cache/task-state
  FILES_TO_HASH: |
    examples/task-cache/Taskfile.yml
    examples/task-cache/src/**

permissions:
  contents: read

jobs:
  hash_pr:
    name: Hash Task files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      files_hash: ${{ steps.hash.outputs.files_hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Hash Task files
        id: hash
        run: |
          HASH="${{ hashFiles(env.FILES_TO_HASH) }}"
          echo "files_hash=$HASH" >> "$GITHUB_OUTPUT"
  save-cache:
    name: Run task and save asset cache
    needs: hash_pr
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

      - name: Run task build
        run: task --taskfile examples/task-cache/Taskfile.yml build

      - name: Save task build cache asset
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: false

  restore-cache:
    name: Restore task cache asset in a fresh job
    needs: [save-cache, hash_pr]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Restore task build cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: task
          key: ${{ needs.hash_pr.outputs.files_hash }}
          path: |
            examples/task-cache/.cache/task
            examples/task-cache/.cache/task-state
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/${{ github.event.repository.default_branch }}/task/linux-x64/${{ needs.hash_pr.outputs.files_hash }}/v1"

      - name: Verify restored task cache
        run: task --taskfile examples/task-cache/Taskfile.yml verify
