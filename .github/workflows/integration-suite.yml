name: Cache integration suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep duplicate integration suites from running in parallel without
  # blocking cleanup, release, or distribution workflows.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect distribution changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_dist: ${{ steps.filter.outputs.build_dist || 'false' }}
    steps:
      - name: Checkout
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Filter distribution changes
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.2
        with:
          filters: |
            build_dist:
              - 'src/**'
              - 'action.yml'
              - 'save/action.yml'
              - 'package.json'
              - 'package-lock.json'

  build-dist:
    needs: detect-changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')  ||  needs.detect-changes.outputs.build_dist == 'true' }}
    uses: ./.github/workflows/build-dist.yml
    with:
      dry-run: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
    permissions:
      contents: write
    secrets: inherit

  node:
    needs: [build-dist]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/npm-cache-asset-integration.yml
    permissions:
      contents: write
    secrets: inherit

  uv:
    needs: [build-dist, node]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/uv-cache-asset-integration.yml
    permissions:
      contents: write
    secrets: inherit

  uv-python:
    needs: [build-dist, uv]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/uv-python-cache-asset-integration.yml
    permissions:
      contents: write
    secrets: inherit

  task:
    needs: [build-dist, uv-python]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/task-cache-asset-integration.yml
    permissions:
      contents: write
    secrets: inherit

  java:
    needs: [build-dist, task]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/maven-cache-asset-integration.yml
    permissions:
      contents: write
    secrets: inherit

  gradle-save-cache:
    name: Save Gradle cache asset
    needs: [build-dist, java]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/gradle-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets: inherit

  gradle-restore-cache:
    name: Restore Gradle cache asset
    needs: [gradle-save-cache]
    if: always() && (needs.gradle-save-cache.result == 'success')
    uses: ./.github/workflows/gradle-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: write
    secrets: inherit

  docker-save-cache:
    name: Save Docker cache asset
    needs: [build-dist, gradle-restore-cache]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/docker-cache-asset-integration.yml
    with:
      save-cache: true
    permissions:
      contents: write
    secrets: inherit

  docker-restore-cache:
    name: Restore Docker cache asset
    needs: [docker-save-cache]
    if: always() && (needs.docker-save-cache.result == 'success')
    uses: ./.github/workflows/docker-cache-asset-integration.yml
    with:
      restore-cache: true
    permissions:
      contents: write
    secrets: inherit

  # when an upstream job fails.
  all-checks-passed:
    name: All checks passed
    if: always()
    needs: [build-dist, node, uv, uv-python, task, java, gradle-save-cache, gradle-restore-cache, docker-save-cache, docker-restore-cache]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: All checks passed
        run: echo "All checks passed!"

      - name: Verify every required job passed (or was legitimately skipped)
        env:
          JOB_RESULTS: >-
            build-dist=${{ needs.build-dist.result }}
            node=${{ needs.node.result }}
            uv=${{ needs.uv.result }}
            uv-python=${{ needs.uv-python.result }}
            task=${{ needs.task.result }}
            java=${{ needs.java.result }}
            gradle-save-cache=${{ needs.gradle-save-cache.result }}
            gradle-restore-cache=${{ needs.gradle-restore-cache.result }}
            docker-save-cache=${{ needs.docker-save-cache.result }}
            docker-restore-cache=${{ needs.docker-restore-cache.result }}
        shell: bash
        run: |
          while IFS='=' read -r job result; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Job $job did not pass (result: $result)"
              exit 1
            fi
          done < <(printf '%s\n' "$JOB_RESULTS" | tr ' ' '\n')
