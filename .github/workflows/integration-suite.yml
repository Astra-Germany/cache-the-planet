name: Cache integration suite

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Keep duplicate integration suites from running in parallel without
  # blocking cleanup, release, or distribution workflows.
  group: cache-integration-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect distribution changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build_dist: ${{ steps.filter.outputs.build_dist || 'false' }}
    steps:
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Filter distribution changes
        if: github.event_name == 'push'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.2
        with:
          filters: |
            build_dist:
              - 'src/**'
              - 'action.yml'
              - 'save/action.yml'
              - 'package.json'
              - 'package-lock.json'

  build-dist:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.build_dist == 'true'
    uses: ./.github/workflows/build-dist.yml
    permissions:
      contents: write
    secrets: inherit

  node:
    needs: [detect-changes, build-dist]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/node-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  uv:
    needs: [detect-changes, build-dist, node]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/uv-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  uv-python:
    needs: [detect-changes, build-dist, uv]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/uv-python-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  task:
    needs: [detect-changes, build-dist, uv-python]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/task-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  java:
    needs: [detect-changes, build-dist, task]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/java-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  gradle:
    needs: [detect-changes, build-dist, java]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped')
    uses: ./.github/workflows/gradle-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit

  docker:
    needs: [detect-changes, build-dist, gradle]
    if: always() && (needs.build-dist.result == 'success' || needs.build-dist.result == 'skipped') && false
    uses: ./.github/workflows/docker-cache-integration.yml
    permissions:
      contents: write
    secrets: inherit
