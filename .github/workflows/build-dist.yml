name: Build action distribution
on:
  push:
    branches: [main]
    paths-ignore: ['dist/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global
      - name: Restore npm cache asset
        uses: ./
        with:
          repository: Ludy87/cache-the-planet
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/node-build/linux-amd64/npm/${{ hashFiles('package-lock.json') }}/v1
          path: .cache/npm
          strict: false
      - run: npm install
      - run: npm run build
      - name: Save npm cache asset
        if: success()
        uses: ./save
        with:
          repository: Ludy87/cache-the-planet
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/node-build/linux-amd64/npm/${{ hashFiles('package-lock.json') }}/v1
          path: .cache/npm
          strict: false
      - name: Commit generated dist
        run: |
          if git diff --quiet -- dist; then echo "dist is already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package-lock.json
          git commit -m "chore: build action dist"
          git push
