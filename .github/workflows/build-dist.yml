name: Build action distribution
concurrency:
  group: build-action-distribution
  cancel-in-progress: true
on:
  push:
    branches: [main]
    paths-ignore: ['dist/**', '**.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global
      - name: Restore npm cache asset
        uses: ./
        with:
          repository: Ludy87/cache-the-planet
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/node-build/linux-amd64/npm/${{ hashFiles('package-lock.json') }}/v1
          path: .cache/npm
          strict: false
      - run: npm install
      - name: Save npm cache asset
        if: success()
        uses: ./save
        with:
          repository: Ludy87/cache-the-planet
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/node-build/linux-amd64/npm/${{ hashFiles('package-lock.json') }}/v1
          path: .cache/npm
          strict: false
      - name: Commit generated dist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            npm run build
            if git diff --quiet -- dist package-lock.json; then
              echo "dist is already up to date"
              exit 0
            fi
            git add -f dist package-lock.json
            git commit -m "chore: build action dist"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push conflicted; retrying build (attempt $((attempt + 1)))"
            git reset --hard origin/main
          done
          echo "Unable to push generated dist after 3 attempts"
          exit 1
