name: Docker cache integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CACHE_REPOSITORY: Ludy87/cache-the-planet

jobs:
  save-cache:
    name: Build and save cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Docker cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/example-docker/linux-amd64/${{ hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt') }}/v2
          path: examples/docker-cache/.cache/docker-buildx
          # Ein beschädigtes oder fehlendes altes Objekt darf den Reparaturlauf nicht blockieren.
          strict: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build example image
        uses: docker/build-push-action@v6
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:test
          push: false
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
          cache-to: type=local,dest=examples/docker-cache/.cache/docker-buildx-new,mode=max

      - name: Replace local BuildKit cache
        shell: bash
        run: |
          rm -rf examples/docker-cache/.cache/docker-buildx
          mv examples/docker-cache/.cache/docker-buildx-new examples/docker-cache/.cache/docker-buildx

      - name: Save Docker cache object
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/example-docker/linux-amd64/${{ hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt') }}/v2
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

  restore-cache:
    name: Restore cache in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Docker cache
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          token: ${{ secrets.GITHUB_TOKEN }}
          key: trusted/Ludy87/cache-the-planet/example-docker/linux-amd64/${{ hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt') }}/v2
          path: examples/docker-cache/.cache/docker-buildx
          strict: true

      - name: Assert exact cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/Ludy87/cache-the-planet/example-docker/linux-amd64/${{ hashFiles('examples/docker-cache/Dockerfile', 'examples/docker-cache/hello.txt') }}/v2"
          test -d examples/docker-cache/.cache/docker-buildx

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build using restored cache
        uses: docker/build-push-action@v6
        with:
          context: examples/docker-cache
          file: examples/docker-cache/Dockerfile
          tags: cache-the-planet-example:restored
          push: false
          cache-from: type=local,src=examples/docker-cache/.cache/docker-buildx
