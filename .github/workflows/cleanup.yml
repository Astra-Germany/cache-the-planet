name: Garbage collection
concurrency:
  group: cache-garbage-collection
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: orphan
        type: choice
        options: [orphan, all, object]
      object:
        description: SHA-256 hash or asset filename when mode is object
        required: false
        type: string
      dry-run:
        { description: Dry run, required: false, default: true, type: boolean }
  schedule: [{ cron: "0 3 * * *" }]
jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node dist/gc.js
        env:
          CACHE_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GC_MODE: ${{ inputs.mode || 'orphan' }}
          GC_OBJECT: ${{ inputs.object || '' }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || (inputs.dry-run && 'true' || 'false') }}
