name: npm cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Astra-Germany/cache-the-planet

jobs:
  save-cache:
    name: Install and save npm cache asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Install dependencies
        run: npm ci

      - name: Save npm cache asset
        if: success()
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ hashFiles('package-lock.json') }}
          path: .cache/npm
          strict: true

  restore-cache:
    name: Restore npm cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm cache directory
        run: npm config set cache "$PWD/.cache/npm" --global

      - name: Restore npm cache asset - auto
        id: cache-auto
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: npm
          token: ${{ secrets.GITHUB_TOKEN }}
          scope: auto
          key: ${{ hashFiles('package-lock.json') }}
          restore-keys: |
            linux-x64/
          path: .cache/npm
          strict: true

      - name: Assert exact asset cache hit start with trusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'trusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/npm/linux-x64/${{ hashFiles('package-lock.json') }}/v1"
          test -d .cache/npm

      - name: Assert exact asset cache hit start with untrusted
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'untrusted/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "untrusted/${{ github.repository }}/pr-${{ github.event.pull_request.number }}/npm/linux-x64/${{ hashFiles('package-lock.json') }}/v1"
          test -d .cache/npm

      - name: Assert exact asset cache hit start with shared
        if: ${{ steps.cache-auto.outputs.matched-key != '' && startsWith(steps.cache-auto.outputs.matched-key, 'shared/') }}
        shell: bash
        run: |
          test "${{ steps.cache-auto.outputs.cache-hit }}" = "true"
          test "${{ steps.cache-auto.outputs.matched-key }}" = "shared/${{ github.repository }}/npm/linux-x64/${{ hashFiles('package-lock.json') }}/v1"
          test -d .cache/npm

      - name: Verify npm can use restored cache
        run: npm ci --prefer-offline
