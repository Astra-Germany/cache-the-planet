name: Gradle cache asset integration
on:
  workflow_call:

env:
  CACHE_REPOSITORY: Astra-Germany/cache-the-planet
  GRADLE_USER_HOME: ${{ github.workspace }}/.cache/gradle

jobs:
  save-cache:
    name: Build and save Gradle cache asset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Gradle cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          path: .cache/gradle
          strict: false

      - name: Build with Gradle
        working-directory: examples/gradle-cache
        run: gradle --no-daemon test

      - name: Save Gradle cache asset
        if: success()
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          path: .cache/gradle
          strict: true

  restore-cache:
    name: Restore Gradle cache asset in a fresh job
    needs: save-cache
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Gradle cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          path: .cache/gradle
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "trusted/${{ github.repository }}/main/gradle-java17/linux-x64/${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}/v1"

      - name: Build offline with restored Gradle cache
        working-directory: examples/gradle-cache
        run: gradle --offline --no-daemon test

  save-cache-shared:
    name: Build and save Gradle cache asset - shared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Gradle cache asset
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          restore-keys: |
            shared/${{ github.repository }}/gradle-java17/linux-x64/
          allow-shared-restore: true
          path: .cache/gradle
          strict: false

      - name: Build with Gradle
        working-directory: examples/gradle-cache
        run: gradle --no-daemon test

      - name: Save Gradle cache asset
        if: success()
        uses: ./save
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          scope: shared
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          path: .cache/gradle
          strict: true

  restore-cache-shared:
    name: Restore Gradle cache asset in a fresh job - shared
    needs: save-cache-shared
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache-jdk: false

      - name: Restore Gradle cache asset
        id: cache
        uses: ./
        with:
          repository: ${{ env.CACHE_REPOSITORY }}
          cache-name: gradle-java17
          token: ${{ secrets.GITHUB_TOKEN }}
          scope: auto
          key: ${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}
          restore-keys: |
            linux-x64/
          allow-shared-restore: true
          path: .cache/gradle
          strict: true

      - name: Assert exact asset cache hit
        shell: bash
        run: |
          test "${{ steps.cache.outputs.cache-hit }}" = "true"
          test "${{ steps.cache.outputs.matched-key }}" = "shared/${{ github.repository }}/gradle-java17/linux-x64/${{ hashFiles('examples/gradle-cache/build.gradle', 'examples/gradle-cache/settings.gradle', 'examples/gradle-cache/src/**/*.java') }}/v1"

      - name: Build offline with restored Gradle cache
        working-directory: examples/gradle-cache
        run: gradle --offline --no-daemon test
