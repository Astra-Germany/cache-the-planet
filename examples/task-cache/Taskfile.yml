version: '3'

tasks:
  build:
    desc: Create a deterministic task build cache entry
    cmds:
      - mkdir -p .cache/task
      - printf 'generated by go-task\n' > .cache/task/build-marker.txt

  verify:
    desc: Verify the restored task cache
    cmds:
      - test -f .cache/task/build-marker.txt
      - grep -q 'generated by go-task' .cache/task/build-marker.txt
