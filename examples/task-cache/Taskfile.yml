version: '3'

tasks:
  build:
    desc: Build an artifact using go-task's sources/generates tracking
    sources:
      - src/input.txt
    generates:
      - .cache/task/build/output.txt
    cmds:
      - mkdir -p .cache/task/build
      - printf 'generated by go-task: ' > .cache/task/build/output.txt
      - tr -d '\n' < src/input.txt >> .cache/task/build/output.txt

  verify:
    desc: Verify the restored task cache
    cmds:
      - test -f .cache/task/build/output.txt
      - grep -q 'generated by go-task: cache-the-planet' .cache/task/build/output.txt
